<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Diary Detail</title>
    <style>
        body { font-family: sans-serif; background-color: #ffffff; padding: 20px; color: #000; }
        .container { max-width: 800px; margin: 0 auto; border: 1px solid #000; padding: 20px; }
        .back-btn { text-decoration: none; color: #000; border: 1px solid #000; padding: 5px; display: inline-block; margin-bottom: 20px; }
        .title { font-size: 24px; font-weight: bold; border-bottom: 1px solid #000; padding-bottom: 10px; margin-bottom: 10px; }
        .date { font-size: 14px; margin-bottom: 20px; }
        .content { font-size: 16px; white-space: pre-wrap; margin-bottom: 30px; }
        .image-gallery { display: flex; flex-wrap: wrap; gap: 10px; border-top: 1px dashed #000; padding-top: 20px; }
        .image-gallery img { width: 150px; height: 150px; object-fit: cover; border: 1px solid #000; cursor: pointer; }
    </style>
</head>
<body>
<div class="container">
    <a href="/diary" class="back-btn">← Back to List</a>
    <div id="detailContainer">
        <h1 class="title" id="title">Loading...</h1>
        <div class="date" id="date"></div>
        <div class="content" id="content"></div>
        <div class="image-gallery" id="imageGallery"></div>
    </div>
</div>

<script>
    const pathParts = window.location.pathname.split('/');
    const diaryId = pathParts[pathParts.length - 1];

    async function fetchDetail() {
        try {
            const response = await fetch(`/api/diaries/${diaryId}`);
            const data = await response.json();

            if (data.isSuccess) {
                const result = data.result;
                document.getElementById('title').innerText = result.title;
                document.getElementById('date').innerText = new Date(result.createdAt).toLocaleString('en-US');
                document.getElementById('content').innerText = result.content;

                const gallery = document.getElementById('imageGallery');
                gallery.innerHTML = '';

                if (result.imageUrlList && result.imageUrlList.length > 0) {
                    result.imageUrlList.forEach(url => {
                        const img = document.createElement('img');
                        img.src = url;
                        img.alt = "Diary Image";
                        img.onclick = () => window.open(url, '_blank');
                        gallery.appendChild(img);
                    });
                }
            } else {
                alert('Failed to load the diary.');
            }
        } catch (error) {
            console.error("Failed to fetch detail", error);
        }
    }

    fetchDetail();
</script>
</body>
</html>
