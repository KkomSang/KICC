<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Write Diary</title>
    <style>
        body { font-family: sans-serif; background-color: #ffffff; padding: 20px; color: #000; }
        .container { max-width: 800px; margin: 0 auto; border: 1px solid #000; padding: 20px; }
        h2 { border-bottom: 1px solid #000; padding-bottom: 10px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input[type="text"], textarea { width: 100%; padding: 8px; border: 1px solid #000; box-sizing: border-box; }
        textarea { height: 150px; resize: vertical; }
        #file-list-display { margin-top: 10px; padding: 10px; border: 1px dashed #000; }
        .file-item { margin-bottom: 5px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .remove-btn { color: #000; text-decoration: underline; cursor: pointer; margin-left: 10px; font-size: 12px; }
        .submit-btn { padding: 10px 20px; border: 1px solid #000; background: #eee; cursor: pointer; font-weight: bold; width: 100%; }
    </style>
</head>
<body>
<div class="container">
    <h2>Write a New Diary</h2>
    <form id="writeForm">
        <div class="form-group">
            <label for="title">Title</label>
            <input type="text" id="title" required>
        </div>
        <div class="form-group">
            <label for="content">Content</label>
            <textarea id="content" required></textarea>
        </div>
        <div class="form-group">
            <label for="images">Attach Photos (Multiple files allowed)</label>
            <input type="file" id="images" accept="image/*" multiple>
            <div id="file-list-display">No photos selected.</div>
        </div>
        <button type="submit" class="submit-btn">Save Diary</button>
    </form>
</div>

<script>
    let selectedFiles = [];

    document.getElementById('images').addEventListener('change', (e) => {
        const files = Array.from(e.target.files);
        files.forEach(file => selectedFiles.push(file));
        renderFileList();
        e.target.value = "";
    });

    function renderFileList() {
        const display = document.getElementById('file-list-display');
        if (selectedFiles.length === 0) {
            display.innerHTML = "No photos selected.";
            return;
        }
        display.innerHTML = selectedFiles.map((file, index) => `
            <div class="file-item">
                <span>${file.name} (${(file.size / 1024).toFixed(1)} KB)</span>
                <span class="remove-btn" onclick="removeFile(${index})">Remove</span>
            </div>
        `).join('');
    }

    function removeFile(index) {
        selectedFiles.splice(index, 1);
        renderFileList();
    }

    document.getElementById('writeForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const formData = new FormData();
        const requestData = {
            title: document.getElementById('title').value,
            content: document.getElementById('content').value
        };

        formData.append('request', new Blob([JSON.stringify(requestData)], { type: "application/json" }));
        selectedFiles.forEach(file => formData.append('images', file));

        try {
            const response = await fetch('/api/diaries', { method: 'POST', body: formData });
            const data = await response.json();
            if (data.isSuccess) {
                alert('Diary successfully saved!');
                window.location.href = '/diary';
            } else {
                alert('Failed to save: ' + data.message);
            }
        } catch (error) {
            console.error("Error:", error);
            alert('Server communication failed.');
        }
    });
</script>
</body>
</html>
