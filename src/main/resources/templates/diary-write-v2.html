<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Write Diary</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; padding: 20px; color: #e0e0e0; }
        .container { max-width: 800px; margin: 0 auto; background: #1e1e1e; padding: 40px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border-top: 6px solid #ffd166; }

        h2 { text-align: center; color: #ffffff; margin-bottom: 35px; font-weight: 800; }
        .form-group { margin-bottom: 25px; }
        label { display: block; font-weight: 700; margin-bottom: 10px; color: #cccccc; }

        input[type="text"], textarea { width: 100%; padding: 15px; border: 2px solid #333333; border-radius: 10px; box-sizing: border-box; font-family: inherit; font-size: 15px; transition: all 0.2s ease; background-color: #2c2c2c; color: #e0e0e0; }
        input[type="text"]:focus, textarea:focus { outline: none; border-color: #ffd166; background-color: #1e1e1e; box-shadow: 0 0 0 4px rgba(255, 209, 102, 0.15); }
        textarea { height: 220px; resize: vertical; line-height: 1.6; }

        #file-list-display { margin-top: 15px; padding: 15px; background: #2a261c; border-radius: 10px; font-size: 14px; color: #cccccc; border: 1px dashed #ffd166; }
        .file-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding: 10px 15px; background: #2c2c2c; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.5); color: #e0e0e0; }
        .file-item:last-child { margin-bottom: 0; }
        .remove-btn { color: #ff6b6b; cursor: pointer; font-weight: bold; margin-left: 10px; transition: background 0.2s, color 0.2s; padding: 5px 10px; background: #3a1515; border-radius: 6px; }
        .remove-btn:hover { background: #5c1818; color: #ff8787; }

        .submit-btn { width: 100%; padding: 16px; background-color: #ffd166; color: #121212; border: none; border-radius: 10px; font-size: 18px; font-weight: 800; cursor: pointer; margin-top: 20px; transition: all 0.2s ease; box-shadow: 0 4px 10px rgba(255, 209, 102, 0.2); }
        .submit-btn:hover { background-color: #ffc233; transform: translateY(-2px); box-shadow: 0 6px 15px rgba(255, 209, 102, 0.3); }
    </style>
</head>
<body>
<div class="container">
    <h2>Write a New Diary</h2>
    <form id="writeForm">
        <div class="form-group">
            <label for="title">Title</label>
            <input type="text" id="title" required>
        </div>
        <div class="form-group">
            <label for="content">Content</label>
            <textarea id="content" required></textarea>
        </div>
        <div class="form-group">
            <label for="images">Attach Photos (Multiple files allowed)</label>
            <input type="file" id="images" accept="image/*" multiple style="color: #cccccc;">
            <div id="file-list-display">No photos selected.</div>
        </div>
        <button type="submit" class="submit-btn">Save</button>
    </form>
</div>

<script>
    let selectedFiles = [];

    document.getElementById('images').addEventListener('change', (e) => {
        const files = Array.from(e.target.files);
        files.forEach(file => selectedFiles.push(file));
        renderFileList();
        e.target.value = "";
    });

    function renderFileList() {
        const display = document.getElementById('file-list-display');
        if (selectedFiles.length === 0) {
            display.innerHTML = "No photos selected.";
            return;
        }
        display.innerHTML = selectedFiles.map((file, index) => `
            <div class="file-item">
                <span>${file.name} <span style="color:#888888; font-size:12px;">(${(file.size / 1024).toFixed(1)} KB)</span></span>
                <span class="remove-btn" onclick="removeFile(${index})">Remove</span>
            </div>
        `).join('');
    }

    function removeFile(index) {
        selectedFiles.splice(index, 1);
        renderFileList();
    }

    document.getElementById('writeForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const formData = new FormData();
        const requestData = {
            title: document.getElementById('title').value,
            content: document.getElementById('content').value
        };

        formData.append('request', new Blob([JSON.stringify(requestData)], { type: "application/json" }));
        selectedFiles.forEach(file => formData.append('images', file));

        try {
            const response = await fetch('/api/diaries', { method: 'POST', body: formData });
            const data = await response.json();
            if (data.isSuccess) {
                alert('Diary successfully saved!');
                window.location.href = '/diary';
            } else {
                alert('Failed to save: ' + data.message);
            }
        } catch (error) {
            console.error("Error:", error);
            alert('Server communication failed.');
        }
    });
</script>
</body>
</html>
